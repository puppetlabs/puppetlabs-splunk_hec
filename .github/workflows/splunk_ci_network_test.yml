name: "Splunk CI Network Test"

# Temporary test workflow. Answers four questions about replacing the persistent Splunk
# CI server with a Splunk container on a second provisioned VM:
#   1. Can the two provisioned VMs reach each other on 8088 (HEC) and 8089 (mgmt)?
#   2. What is each node's FQDN / private IP, and does the PE server resolve the Splunk node's FQDN?
#   3. Does the Splunk container start on the VM size we get, and does the HEC cert
#      (signed by the PE CA, issued for the Splunk node's FQDN) validate?
#   4. Does an authenticated HEC event from the PE server succeed?
# Nothing here uses repository secrets.

on:
  pull_request:

jobs:
  network_test:
    name: "PE: ${{ matrix.pe_image }} / Splunk: ${{ matrix.splunk_image }}"
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - pe_image: almalinux-cloud/almalinux-8
            splunk_image: rhel-9

    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: Activate Ruby 3.1
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Create the fixtures directory
        run: bundle exec rake spec_prep

      - name: Provision PE server VM and Splunk VM
        run: |
          set -x
          bundle exec bolt --modulepath spec/fixtures/modules task run provision::provision_service \
            --targets localhost action=provision platform='${{ matrix.pe_image }}' vars='role: server'
          bundle exec bolt --modulepath spec/fixtures/modules task run provision::provision_service \
            --targets localhost action=provision platform='${{ matrix.splunk_image }}' vars='role: splunk_node'
          set +x
          if [ -f spec/fixtures/litmus_inventory.yaml ]; then
            FILE=spec/fixtures/litmus_inventory.yaml
          else
            FILE=inventory.yaml
          fi
          echo "::group::=== INVENTORY (redacted) ==="
          sed -e 's/password: .*/password: "[redacted]"/' < "$FILE"
          echo "::endgroup::"
          echo "INVENTORY_PATH=$FILE" >> "$GITHUB_ENV"
          eval "$(ruby -ryaml -e '
            t = YAML.load_file(ARGV[0])["groups"].find { |g| g["name"] == "ssh_nodes" }["targets"]
            puts "echo SERVER_URI=#{t.find { |x| x.dig("vars", "role") == "server" }["uri"]} >> $GITHUB_ENV"
            puts "echo SPLUNK_URI=#{t.find { |x| x.dig("vars", "role") == "splunk_node" }["uri"]} >> $GITHUB_ENV"
          ' "$FILE")"

      - name: Wait for SSH on both VMs
        run: |
          b() { bundle exec bolt --modulepath spec/fixtures/modules "$@" -i "./$INVENTORY_PATH"; }
          for uri in "$SERVER_URI" "$SPLUNK_URI"; do
            ready=no
            for i in $(seq 1 24); do
              if b command run 'true' --targets "$uri" >/dev/null 2>&1; then ready=yes; break; fi
              echo "waiting for SSH on $uri (attempt $i)"; sleep 10
            done
            echo "SSH ready on $uri: $ready"
            [ "$ready" = yes ] || exit 1
          done

      - name: Record node identity (FQDN, private IP, resources)
        run: |
          b() { bundle exec bolt --modulepath spec/fixtures/modules "$@" -i "./$INVENTORY_PATH"; }
          cat > node_info.sh <<'EOF'
          #!/bin/bash
          echo "hostname -f: $(hostname -f)"
          echo "hostname -I: $(hostname -I 2>/dev/null)"
          MD=http://metadata.google.internal/computeMetadata/v1/instance
          echo "metadata hostname: $(curl -s -m 5 -H 'Metadata-Flavor: Google' $MD/hostname)"
          echo "metadata private ip: $(curl -s -m 5 -H 'Metadata-Flavor: Google' $MD/network-interfaces/0/ip)"
          echo "metadata network: $(curl -s -m 5 -H 'Metadata-Flavor: Google' $MD/network-interfaces/0/network)"
          echo "metadata machine-type: $(curl -s -m 5 -H 'Metadata-Flavor: Google' $MD/machine-type)"
          echo "nproc: $(nproc)"
          free -m
          df -h /
          echo "firewalld: $(systemctl is-active firewalld 2>&1)"
          echo "python3: $(command -v python3)"
          EOF
          chmod +x node_info.sh
          for role in SERVER SPLUNK; do
            uri_var="${role}_URI"; uri="${!uri_var}"
            echo "::group::=== $role node $uri ==="
            b script run ./node_info.sh --targets "$uri" || true
            echo "::endgroup::"
            fqdn=$(b command run 'hostname -f' --targets "$uri" --format json | jq -r '.items[0].value.stdout' | tr -d '[:space:]')
            priv=$(b command run "curl -s -m 5 -H 'Metadata-Flavor: Google' http://metadata.google.internal/computeMetadata/v1/instance/network-interfaces/0/ip" --targets "$uri" --format json | jq -r '.items[0].value.stdout' | tr -d '[:space:]')
            for v in "$fqdn" "$priv"; do
              if [ -z "$v" ] || [ "$v" = null ]; then echo "missing FQDN or private IP for $role"; exit 1; fi
            done
            echo "${role}_FQDN=$fqdn" >> "$GITHUB_ENV"
            echo "${role}_PRIV=$priv" >> "$GITHUB_ENV"
          done

      - name: "Check 1: raw connectivity (plain listeners, before any install)"
        run: |
          b() { bundle exec bolt --modulepath spec/fixtures/modules "$@" -i "./$INVENTORY_PATH"; }
          : > results.txt
          check() { # name, then the bolt command
            local name="$1"; shift
            echo "::group::$name"
            if "$@"; then echo "PASS  $name" >> results.txt; else echo "FAIL  $name" >> results.txt; fi
            echo "::endgroup::"
          }
          # Plain HTTP listeners on the Splunk node, detached so they outlive the bolt session.
          b command run 'for p in 8088 8089; do setsid nohup python3 -m http.server $p --bind 0.0.0.0 >/dev/null 2>&1 < /dev/null & done; sleep 2; ss -ltn | grep -E ":(8088|8089)"' --targets "$SPLUNK_URI"
          probe() { # phase label
            check "[$1] PE server resolves Splunk FQDN ($SPLUNK_FQDN)" b command run "getent hosts $SPLUNK_FQDN" --targets "$SERVER_URI"
            for port in 8088 8089; do
              check "[$1] PE server -> Splunk FQDN :$port"       b command run "curl -sS -m 8 -o /dev/null -w '%{http_code}\n' http://$SPLUNK_FQDN:$port/" --targets "$SERVER_URI"
              check "[$1] PE server -> Splunk private IP :$port" b command run "curl -sS -m 8 -o /dev/null -w '%{http_code}\n' http://$SPLUNK_PRIV:$port/" --targets "$SERVER_URI"
              check "[$1] PE server -> Splunk public IP :$port"  b command run "curl -sS -m 8 -o /dev/null -w '%{http_code}\n' http://${SPLUNK_URI%%:*}:$port/" --targets "$SERVER_URI"
            done
          }
          probe "firewalld as provisioned"
          # If firewalld is running on the Splunk node, open the ports (runtime only) and probe again.
          # A pass here that failed above means the host firewall, not the VPC, was blocking.
          check "Splunk node firewalld state" b command run 'systemctl is-active firewalld; firewall-cmd --list-all 2>&1 | head -20' --targets "$SPLUNK_URI"
          b command run 'command -v firewall-cmd >/dev/null && firewall-cmd --add-port=8088/tcp --add-port=8089/tcp || true' --targets "$SPLUNK_URI" || true
          probe "ports opened in firewalld"
          b command run 'pkill -f "http.server" || true' --targets "$SPLUNK_URI" || true

      - name: Install PE on the server VM
        run: |
          bundle exec bolt --modulepath spec/fixtures/modules plan run splunk_hec::acceptance::server_setup \
            puppet_version='2023.8.13-puppet_enterprise' -i "./$INVENTORY_PATH" --stream

      - name: Start Splunk in Docker on the Splunk VM (cert issued for the Splunk FQDN)
        run: |
          b() { bundle exec bolt --modulepath spec/fixtures/modules "$@" -i "./$INVENTORY_PATH"; }
          b script run spec/support/acceptance/generate_splunk_cert.sh "$SPLUNK_FQDN" --targets "$SERVER_URI" --format json \
            | jq -r '.items[0].value.stdout' > puppet_hec.pem
          test -s puppet_hec.pem
          b file upload ./spec/support/acceptance/splunk /tmp/splunk --targets "$SPLUNK_URI"
          b file upload ./puppet_hec.pem /tmp/splunk/puppet_hec.pem --targets "$SPLUNK_URI"
          rm -f puppet_hec.pem
          b script run spec/support/acceptance/start_splunk_instance.sh --targets "$SPLUNK_URI"

      - name: "Check 2: Splunk + HEC reachable and cert valid from the PE server"
        run: |
          b() { bundle exec bolt --modulepath spec/fixtures/modules "$@" -i "./$INVENTORY_PATH"; }
          check() {
            local name="$1"; shift
            echo "::group::$name"
            if "$@"; then echo "PASS  $name" >> results.txt; else echo "FAIL  $name" >> results.txt; fi
            echo "::endgroup::"
          }
          CA='$(puppet config print localcacert)'
          check "HEC health, FQDN, verified against PE CA" \
            b command run "curl -sS -m 15 --cacert $CA https://$SPLUNK_FQDN:8088/services/collector/health" --targets "$SERVER_URI"
          check "HEC health, private IP, -k (isolates DNS from firewall)" \
            b command run "curl -sSk -m 15 https://$SPLUNK_PRIV:8088/services/collector/health" --targets "$SERVER_URI"
          check "Mgmt API 8089, FQDN, admin login" \
            b command run "curl -sSk -m 15 -u admin:piepiepie 'https://$SPLUNK_FQDN:8089/services/server/info?output_mode=json' | head -c 300; echo" --targets "$SERVER_URI"
          check "HEC authenticated event send (token abcd1234)" \
            b command run "curl -sS -m 15 --cacert $CA -H 'Authorization: Splunk abcd1234' -d '{\"event\":\"ci-network-test\"}' https://$SPLUNK_FQDN:8088/services/collector/event" --targets "$SERVER_URI"

      - name: Splunk container diagnostics
        if: ${{ always() }}
        continue-on-error: true
        run: |
          b() { bundle exec bolt --modulepath spec/fixtures/modules "$@" -i "./$INVENTORY_PATH"; }
          b command run 'docker ps -a; docker stats --no-stream; free -m; docker logs --tail 40 splunk-enterprise-1 2>&1 || docker logs --tail 40 $(docker ps -aq | head -1) 2>&1' --targets "$SPLUNK_URI"

      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "### Splunk CI network test"
            echo ""
            echo "PE server: \`$SERVER_FQDN\` (private \`$SERVER_PRIV\`)  "
            echo "Splunk node: \`$SPLUNK_FQDN\` (private \`$SPLUNK_PRIV\`)"
            echo ""
            echo '```'
            cat results.txt 2>/dev/null || echo "no results recorded"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Remove test environment
        if: ${{ always() }}
        continue-on-error: true
        run: |
          if [[ -f inventory.yaml || -f spec/fixtures/litmus_inventory.yaml ]]; then
            bundle exec rake 'litmus:tear_down'
          fi
